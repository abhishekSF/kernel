<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #101d16;
      --panel: #14251c;
      --line: rgba(238, 243, 236, 0.1);
      --cream: #eef3ec;
      --mist: #8ba093;
      --mint: #45d0a0;
      --ember: #ff6b52;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--cream);
      font-family: "Instrument Sans", system-ui, sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    .head { display: flex; align-items: center; justify-content: space-between; }
    .title { font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
    .sub { font-size: 9.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mist); margin-top: 2px; }
    .switch { position: relative; width: 40px; height: 22px; border-radius: 999px; border: none; cursor: pointer; background: rgba(238,243,236,0.14); transition: background 0.25s; }
    .switch.on { background: var(--mint); }
    .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--cream); transition: left 0.25s; }
    .switch.on::after { left: 20px; }
    .card { margin-top: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 12px 13px; }
    .card h3 { font-size: 9.5px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mist); }
    .row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .val { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; color: var(--mist); font-variant-numeric: tabular-nums; }
    .bar { height: 4px; border-radius: 999px; background: rgba(238,243,236,0.07); overflow: hidden; margin: 2px 0 6px 16px; }
    .bar > div { height: 100%; border-radius: 999px; transition: width 0.5s ease; }
    .empty { color: var(--mist); font-size: 12px; padding: 6px 0 2px; line-height: 1.5; }
    .total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 2px; }
    .total .big { font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 700; font-size: 24px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn { flex: 1; border: 1px solid var(--line); background: transparent; color: var(--cream); font: inherit; font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 999px; padding: 8px 0; cursor: pointer; transition: all 0.2s; }
    .btn:hover { border-color: rgba(238,243,236,0.3); }
    .btn:active { transform: scale(0.97); }
    .btn.danger { color: var(--ember); border-color: rgba(255,107,82,0.3); }
    .btn.danger.arm { background: var(--ember); color: #2b100a; border-color: var(--ember); }
    .foot { margin-top: 12px; font-size: 10.5px; color: var(--mist); line-height: 1.55; }
    .pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--mint); margin-right: 6px; animation: p 1.6s ease-in-out infinite; vertical-align: 1px; }
    @keyframes p { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
</head>
<body>
  <div class="head">
    <div>
      <div class="title">Kernel Witness</div>
      <div class="sub">local tab tally</div>
    </div>
    <button id="enabled" class="switch" role="switch" aria-label="Enable tracking"></button>
  </div>

  <div class="card">
    <h3>Today · foreground time</h3>
    <div class="total">
      <span class="big" id="todayTotal">0m</span>
      <span class="val" id="todayDate"></span>
    </div>
    <div id="todayRows"></div>
  </div>

  <div class="card">
    <h3>Whitelist</h3>
    <div id="whitelist"></div>
  </div>

  <div class="actions">
    <button class="btn" id="export">Export JSON</button>
    <button class="btn danger" id="wipe">Wipe data</button>
  </div>

  <p class="foot">
    <span class="pulse"></span>Counting runs only while a Kernel focus round is
    active. Only enrolled sites are keyed by project; everything else is one
    anonymous number. Data never leaves this browser.
  </p>

  <script src="popup.js"></script>
</body>
</html>
